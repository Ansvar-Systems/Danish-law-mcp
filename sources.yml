# sources.yml — Data provenance metadata
# License axis: DK-Statutory-PD (Danish statutory public domain)
# Statutory basis: Ophavsretsloven §9 — laws, administrative orders,
# regulations, court decisions, and similar acts of public authority are
# excluded from copyright protection. Verified verbatim 2026-05-17.
# Cross-ref: docs/audits/2026-05-17-eu-copyright-statutory-works-batch-1a-AT-BE-DK-FI-FR.md
# Catalog entry: infrastructure/attribution-licenses.json → "DK-Statutory-PD"

schema_version: '1.0'
mcp_name: 'Danish Law MCP'
jurisdiction: 'DK'

sources:
  - name: 'Retsinformation'
    authority: 'Danish Ministry of Justice (Civilstyrelsen)'
    official_portal: 'https://www.retsinformation.dk'
    canonical_identifier: 'LBK/LOV number'
    retrieval_method: 'API'
    api_documentation: 'https://www.retsinformation.dk/api'
    update_frequency: 'daily'
    last_ingested: '2026-02-14'
    last_verified: '2026-05-09'
    license_or_terms:
      type: 'DK-Statutory-PD'
      url: 'https://www.retsinformation.dk/eli/lta/2023/1093'
      summary: 'Danish statutory public domain (Ophavsretsloven §9). Laws, administrative orders, regulations, court decisions, and similar acts issued by a public authority are excluded from copyright protection. Statute-level basis on the underlying text.'
    coverage:
      scope: 'Danish statutes (love, bekendtgørelser, cirkulærer)'
      limitations: 'Historical consolidations depend on Retsinformation coverage'
    languages:
      - 'da'

data_freshness:
  automated_checks: true
  check_frequency: 'daily'
  last_verified: '2026-02-15'

# Fix-Sweep rebuild contract (chassis corpus freshness automation, 2026-06-10 survey).
# Schema: Ansvar-Architecture-Documentation/infrastructure/policy/rebuild-contract.schema.json
# Runbook: Ansvar-Architecture-Documentation/docs/runbooks/fix-sweep.md
# ingest_cmd is the version-keyed refresh (issue #89): unstamped seeds
# self-heal, statuses map explicitly from the served <Status>, partial runs
# exit non-zero. NOT "npm run ingest:fetch" — that is a methodology-MCP
# template artifact which exits 1 in this repo (no data/content directory).
rebuild_contract:
  schema_version: "1.0"
  runnable: true
  ingest_cmd: "npm run ingest:refresh"
  build_cmd: "npm run build:db"
  build_cwd: "."
  premium_build_cmd: "npm run build:db:paid"
  output_db: "data/database.db"
  schema_kind: "statute"
  drift_cmd: "npm run drift:detect"
  golden_hashes: "fixtures/golden-hashes.json"
