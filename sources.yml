schema_version: '1.0'
mcp_name: 'Danish Law MCP'
jurisdiction: 'DK'

sources:
  - name: 'Retsinformation'
    authority: 'Danish Ministry of Justice (Civilstyrelsen)'
    official_portal: 'https://www.retsinformation.dk'
    canonical_identifier: 'LBK/LOV number'
    retrieval_method: 'API'
    api_documentation: 'https://www.retsinformation.dk/api'
    update_frequency: 'daily'
    last_ingested: '2026-02-14'
    license_or_terms:
      type: 'Government Open Data'
      url: 'https://www.retsinformation.dk/offentliggoerelser/LDA-ophavsret'
      summary: 'Danish legislation is public domain; free to use'
    coverage:
      scope: 'Danish statutes (love, bekendtgørelser, cirkulærer)'
      limitations: 'Historical consolidations depend on Retsinformation coverage'
    languages:
      - 'da'

data_freshness:
  automated_checks: true
  check_frequency: 'daily'
  last_verified: '2026-02-15'

# Fix-Sweep rebuild contract (chassis corpus freshness automation, 2026-06-10 survey).
# Schema: Ansvar-Architecture-Documentation/infrastructure/policy/rebuild-contract.schema.json
# Runbook: Ansvar-Architecture-Documentation/docs/runbooks/fix-sweep.md
rebuild_contract:
  schema_version: "1.0"
  runnable: true
  ingest_cmd: "npm run ingest:fetch"
  build_cmd: "npm run build:db"
  build_cwd: "."
  premium_build_cmd: "npm run build:db:paid"
  output_db: "data/database.db"
  schema_kind: "statute"
  drift_cmd: "npm run drift:detect"
  golden_hashes: "fixtures/golden-hashes.json"
